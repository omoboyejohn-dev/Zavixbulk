<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Zavixbulk</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050817;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:420px;
background:#0b1230;
padding:30px;
border-radius:15px;
border:1px solid #1f3f8b;
box-shadow:0 0 25px rgba(0,119,255,.25);
}

.logo{
text-align:center;
font-size:30px;
font-weight:bold;
color:#4da3ff;
margin-bottom:10px;
}

h2{
text-align:center;
color:#fff;
margin-bottom:25px;
}

.input-box{
margin-bottom:15px;
}

.input-box label{
display:block;
margin-bottom:6px;
color:#ddd;
font-size:14px;
}

.input-box input{
width:100%;
padding:13px;
border:none;
border-radius:8px;
background:#16224d;
color:white;
font-size:15px;
outline:none;
}

.input-box input:focus{
border:1px solid #3399ff;
}

button{
width:100%;
padding:14px;
background:linear-gradient(90deg,#2b6cff,#00b7ff);
border:none;
border-radius:8px;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:.9;
}

#message{
margin-top:15px;
text-align:center;
font-size:14px;
color:#00ff88;
}

.bottom{
text-align:center;
margin-top:20px;
color:#ccc;
}

.bottom a{
color:#4da3ff;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">ZAVIXBULK</div>

<h2>Create Account</h2>

<form id="registerForm">

<div class="input-box">
<label>Full Name</label>
<input type="text" id="fullname" required>
</div>

<div class="input-box">
<label>Username</label>
<input type="text" id="username" required>
</div>

<div class="input-box">
<label>Phone Number</label>
<input type="tel" id="phone" required>
</div>

<div class="input-box">
<label>Gmail Address</label>
<input type="email" id="email" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" id="password" required>
</div>

<div class="input-box">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" required>
</div>

<button type="submit">Create Account</button>

<div id="message"></div>

</form>

<div class="bottom">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<!-- Firebase JavaScript goes here in Part 2 -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.2.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBybvzMgbJjxRggSV-p9cabPwhv3zvQlJs",
authDomain: "zavixbulk.firebaseapp.com",
projectId: "zavixbulk",
storageBucket: "zavixbulk.firebasestorage.app",
messagingSenderId: "819994897169",
appId: "1:819994897169:web:4aab1bcc15fbe439f6fab0",
measurementId: "G-GJ8RY0WYBL"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("registerForm");

form.addEventListener("submit", async (e)=>{

e.preventDefault();

const fullname=document.getElementById("fullname").value.trim();
const username=document.getElementById("username").value.trim();
const phone=document.getElementById("phone").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const confirmPassword=document.getElementById("confirmPassword").value;

const message=document.getElementById("message");

message.style.color="red";

if(password!==confirmPassword){

message.innerHTML="Passwords do not match.";

return;

}

try{

const userCredential=
await createUserWithEmailAndPassword(
auth,
email,
password
);

const user=userCredential.user;

await setDoc(doc(db,"users",user.uid),{

fullname:fullname,
username:username,
phone:phone,
email:email,
role:"customer",
createdAt:serverTimestamp()

});

message.style.color="#00ff88";
message.innerHTML="Registration Successful...";

setTimeout(()=>{

window.location="dashboard.html";

},1500);

}catch(error){

message.innerHTML=error.message;

}

});

</script>
</body>
</html>
