<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zavixbulk | Deposit</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#050817;
    color:#fff;
    min-height:100vh;
}

.header{
    height:70px;
    background:#0a1024;
    border-bottom:1px solid #1b2542;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
}

.logo{
    font-size:22px;
    font-weight:900;
}

.logo span{color:#4f8cff}

.user-name{
    color:#9aa9c4;
    font-size:13px;
}

.main{
    max-width:850px;
    margin:auto;
    padding:100px 20px 50px;
}

.title{
    font-size:28px;
    font-weight:800;
    margin-bottom:8px;
}

.subtitle{
    color:#7586a8;
    font-size:14px;
    margin-bottom:28px;
}

.methods{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.method{
    background:#0a1024;
    border:1px solid #1b2542;
    border-radius:15px;
    padding:25px;
    cursor:pointer;
    transition:.2s;
}

.method:hover{
    border-color:#3977ff;
    transform:translateY(-2px);
}

.icon{
    font-size:34px;
    margin-bottom:13px;
}

.name{
    font-size:16px;
    font-weight:800;
    margin-bottom:5px;
}

.text{
    color:#7182a2;
    font-size:12px;
}

@media(max-width:650px){
    .header{padding:0 16px}
    .user-name{display:none}
    .main{padding:90px 15px 35px}
    .methods{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">ZAVIX<span>BULK</span></div>
    <div class="user-name" id="userName">Customer</div>
</header>

<main class="main">

    <h1 class="title">Deposit Funds</h1>

    <p class="subtitle">
        Choose a cryptocurrency to fund your Zavixbulk wallet.
    </p>

    <div class="methods">

        <div class="method" data-method="bitcoin">
            <div class="icon">₿</div>
            <div class="name">Bitcoin</div>
            <div class="text">BTC Deposit</div>
        </div>

        <div class="method" data-method="litecoin">
            <div class="icon">Ł</div>
            <div class="name">Litecoin</div>
            <div class="text">LTC Deposit</div>
        </div>

        <div class="method" data-method="ethereum">
            <div class="icon">♦</div>
            <div class="name">Ethereum</div>
            <div class="text">ETH Deposit</div>
        </div>

    </div>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore.js";

const firebaseConfig={
    apiKey:"AIzaSyBybvzMgbJjxRggSV-p9cabPwhv3zvQlJs",
    authDomain:"zavixbulk.firebaseapp.com",
    projectId:"zavixbulk",
    storageBucket:"zavixbulk.firebasestorage.app",
    messagingSenderId:"819994897169",
    appId:"1:819994897169:web:4aab1bcc15fbe439f6fab0",
    measurementId:"G-GJ8RY0WYBL"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const userName=document.getElementById("userName");

onAuthStateChanged(auth,async user=>{

    if(!user){
        location.href="login.html";
        return;
    }

    try{

        const snap=await getDoc(
            doc(db,"users",user.uid)
        );

        if(snap.exists()){

            const data=snap.data();

            userName.textContent=
                data.fullname||
                data.username||
                "Customer";
        }

    }catch(error){
        console.error(error);
    }

});

document.querySelectorAll(".method").forEach(method=>{

    method.addEventListener("click",()=>{

        const coin=method.dataset.method;

        location.href=
            "deposit-generate.html?coin="+
            encodeURIComponent(coin);

    });

});

</script>

</body>
</html>
