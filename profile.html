<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zavixbulk | Profile</title><style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Inter,Arial,sans-serif;
    background:#050817;
    color:#fff;
    min-height:100vh;
}

.header{
    height:70px;
    background:#0a1024;
    border-bottom:1px solid #1b2542;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;
}

.logo{
    font-size:22px;
    font-weight:900;
}

.logo span{color:#4f8cff}

.header-right{
    color:#9cacc9;
    font-size:13px;
}

.main{
    max-width:850px;
    margin:auto;
    padding:105px 20px 50px;
}

.back{
    color:#7393d7;
    text-decoration:none;
    font-size:13px;
    display:inline-block;
    margin-bottom:20px;
}

.card{
    background:#0a1024;
    border:1px solid #1b2542;
    border-radius:18px;
    padding:30px;
    margin-bottom:18px;
}

.profile-top{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:30px;
}

.avatar{
    width:75px;
    height:75px;
    border-radius:50%;
    background:linear-gradient(135deg,#1c4ed8,#2868ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:900;
}

.profile-name{
    font-size:23px;
    font-weight:800;
}

.profile-email{
    color:#7789a8;
    font-size:13px;
    margin-top:5px;
}

.section-title{
    font-size:17px;
    font-weight:800;
    margin-bottom:20px;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.info-box{
    background:#070c1c;
    border:1px solid #202e4c;
    border-radius:11px;
    padding:16px;
}

.label{
    color:#687b9d;
    font-size:11px;
    margin-bottom:7px;
}

.value{
    font-size:14px;
    font-weight:700;
    word-break:break-word;
}

.balance{
    color:#5f91ff;
    font-size:21px;
    font-weight:850;
}

.btn{
    display:inline-block;
    text-decoration:none;
    border:0;
    border-radius:9px;
    padding:12px 17px;
    background:#1c55df;
    color:#fff;
    font-weight:700;
    cursor:pointer;
    font-size:13px;
    margin-top:20px;
}

.loading{
    text-align:center;
    padding:100px 20px;
    color:#7182a1;
}

@media(max-width:650px){
    .header{padding:0 16px}
    .header-right{display:none}
    .main{padding:90px 15px 35px}
    .card{padding:22px}
    .info{grid-template-columns:1fr}
}
</style></head><body><header class="header">
    <div class="logo">ZAVIX<span>BULK</span></div>
    <div class="header-right" id="headerName">Customer</div>
</header><main class="main"><a href="dashboard.html" class="back">← Back to Dashboard</a>

<div id="content">
    <div class="loading">Loading profile...</div>
</div></main><script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore.js";


const firebaseConfig={
    apiKey:"AIzaSyBybvzMgbJjxRggSV-p9cabPwhv3zvQlJs",
    authDomain:"zavixbulk.firebaseapp.com",
    projectId:"zavixbulk",
    storageBucket:"zavixbulk.firebasestorage.app",
    messagingSenderId:"819994897169",
    appId:"1:819994897169:web:4aab1bcc15fbe439f6fab0",
    measurementId:"G-GJ8RY0WYBL"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const content=document.getElementById("content");
const headerName=document.getElementById("headerName");

function money(value){
    return "$"+Number(value||0).toLocaleString("en-US",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });
}

function initials(name){
    return String(name||"C")
        .split(" ")
        .filter(Boolean)
        .slice(0,2)
        .map(x=>x[0])
        .join("")
        .toUpperCase();
}

onAuthStateChanged(auth,async user=>{

    if(!user){
        location.href="login.html";
        return;
    }

    try{

        const snap=await getDoc(
            doc(db,"users",user.uid)
        );

        const data=snap.exists()?snap.data():{};

        const name=
            data.fullname ||
            data.username ||
            "Customer";

        headerName.textContent=name;

        content.innerHTML=`

            <div class="card">

                <div class="profile-top">

                    <div class="avatar">
                        ${initials(name)}
                    </div>

                    <div>
                        <div class="profile-name">
                            ${name}
                        </div>

                        <div class="profile-email">
                            ${user.email||data.email||"No email"}
                        </div>
                    </div>

                </div>

                <div class="section-title">
                    Account Information
                </div>

                <div class="info">

                    <div class="info-box">
                        <div class="label">FULL NAME</div>
                        <div class="value">
                            ${data.fullname||"Not provided"}
                        </div>
                    </div>

                    <div class="info-box">
                        <div class="label">USERNAME</div>
                        <div class="value">
                            ${data.username||"Not provided"}
                        </div>
                    </div>

                    <div class="info-box">
                        <div class="label">EMAIL</div>
                        <div class="value">
                            ${user.email||data.email||"Not provided"}
                        </div>
                    </div>

                    <div class="info-box">
                        <div class="label">PHONE</div>
                        <div class="value">
                            ${data.phone||"Not provided"}
                        </div>
                    </div>

                    <div class="info-box">
                        <div class="label">WALLET BALANCE</div>
                        <div class="balance">
                            ${money(data.balance)}
                        </div>
                    </div>

                    <div class="info-box">
                        <div class="label">ACCOUNT TYPE</div>
                        <div class="value">
                            Customer
                        </div>
                    </div>

                </div>

                <a href="settings.html" class="btn">
                    Account Settings
                </a>

            </div>
        `;

    }catch(error){

        console.error(error);

        content.innerHTML=`
            <div class="loading">
                Unable to load your profile.
            </div>
        `;

    }

});

</script></body>
</html>
