<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zavixbulk | Order History</title><style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Inter,Arial,sans-serif;
    background:#050817;
    color:#fff;
    min-height:100vh;
}

.header{
    height:70px;
    background:#0a1024;
    border-bottom:1px solid #1b2542;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:fixed;
    top:0;
    left:0;
    right:0;
}

.logo{font-size:22px;font-weight:900}
.logo span{color:#4f8cff}

.header-right{
    color:#9cacc9;
    font-size:13px;
}

.main{
    max-width:950px;
    margin:auto;
    padding:105px 20px 50px;
}

.back{
    color:#7393d7;
    text-decoration:none;
    font-size:13px;
    display:inline-block;
    margin-bottom:20px;
}

.title{
    font-size:25px;
    font-weight:850;
    margin-bottom:20px;
}

.order{
    background:#0a1024;
    border:1px solid #1b2542;
    border-radius:15px;
    padding:20px;
    margin-bottom:13px;
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
    margin-bottom:15px;
}

.product-name{
    font-size:16px;
    font-weight:800;
    margin-bottom:5px;
}

.order-id{
    color:#566987;
    font-size:10px;
}

.price{
    color:#5d8dff;
    font-size:17px;
    font-weight:850;
    margin-top:5px;
}

.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
    white-space:nowrap;
    background:#302713;
    color:#e6c66b;
}

.delivered{
    background:#102d20;
    color:#62d99a;
}

.rejected{
    background:#321820;
    color:#ff7888;
}

.processing{
    background:#15263c;
    color:#71a9ff;
}

.date{
    color:#637594;
    font-size:11px;
    margin-bottom:14px;
}

.delivery{
    background:#070c1c;
    border:1px solid #243454;
    border-radius:10px;
    padding:15px;
}

.delivery-title{
    color:#65df9c;
    font-size:11px;
    font-weight:800;
    margin-bottom:8px;
}

.delivery-text{
    color:#c1cee2;
    font-size:13px;
    line-height:1.7;
    white-space:pre-line;
    word-break:break-word;
}

.waiting{
    color:#7182a1;
    font-size:12px;
    line-height:1.6;
}

.empty{
    text-align:center;
    padding:80px 20px;
    color:#7182a1;
}

@media(max-width:600px){

    .header{padding:0 16px}
    .header-right{display:none}
    .main{padding:90px 15px 35px}

    .order-top{
        flex-direction:column;
    }

}
</style></head><body><header class="header"><div class="logo">
    ZAVIX<span>BULK</span>
</div>

<div class="header-right" id="headerName">
    Customer
</div>

</header><main class="main"><a href="dashboard.html" class="back">
    ← Back to Dashboard
</a><div class="title">
    Order History
</div><div id="list"><div class="empty">
    Loading orders...
</div>

</div></main><script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    orderBy,
    onSnapshot,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore.js";

const firebaseConfig={
    apiKey:"AIzaSyBybvzMgbJjxRggSV-p9cabPwhv3zvQlJs",
    authDomain:"zavixbulk.firebaseapp.com",
    projectId:"zavixbulk",
    storageBucket:"zavixbulk.firebasestorage.app",
    messagingSenderId:"819994897169",
    appId:"1:819994897169:web:4aab1bcc15fbe439f6fab0",
    measurementId:"G-GJ8RY0WYBL"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const list=document.getElementById("list");
const headerName=document.getElementById("headerName");

function money(value){
    return "$"+Number(value||0).toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );
}

function dateText(value){

    if(!value) return "Processing";

    const date=value.toDate
        ? value.toDate()
        : new Date(value);

    return date.toLocaleString();

}

function statusLabel(status){

    if(status==="delivered" || status==="approved"){
        return "Delivered";
    }

    if(status==="processing"){
        return "Processing";
    }

    if(status==="rejected"){
        return "Rejected";
    }

    return "Pending";

}

function statusClass(status){

    if(status==="delivered" || status==="approved"){
        return "delivered";
    }

    if(status==="processing"){
        return "processing";
    }

    if(status==="rejected"){
        return "rejected";
    }

    return "";

}

onAuthStateChanged(auth,async user=>{

    if(!user){

        location.href="login.html";

        return;

    }

    const userSnap=await getDoc(
        doc(db,"users",user.uid)
    );

    if(userSnap.exists()){

        const data=userSnap.data();

        headerName.textContent=
            data.fullname||
            data.username||
            "Customer";

    }


    const q=query(
        collection(db,"orders"),
        where("userId","==",user.uid),
        orderBy("createdAt","desc")
    );


    onSnapshot(q,snapshot=>{

        if(snapshot.empty){

            list.innerHTML=`

                <div class="empty">

                    📦<br><br>

                    You have not placed any orders yet.

                </div>

            `;

            return;

        }


        list.innerHTML="";


        snapshot.forEach(item=>{

            const data=item.data();

            const status=
                data.status||"pending";

            const delivered=
                status==="delivered" ||
                status==="approved";


            const order=document.createElement(
                "div"
            );

            order.className="order";


            let deliveryHTML="";


            if(delivered){

                deliveryHTML=`

                    <div class="delivery">

                        <div class="delivery-title">
                            ✓ DELIVERY DETAILS
                        </div>

                        <div class="delivery-text">
                            ${data.deliveryDetails||"Delivery details have not been added yet."}
                        </div>

                    </div>

                `;

            }

            else if(status==="rejected"){

                deliveryHTML=`

                    <div class="waiting">
                        This order was rejected by admin.
                    </div>

                `;

            }

            else{

                deliveryHTML=`

                    <div class="waiting">
                        Your payment has been received.
                        Your order is waiting for admin approval.
                        Delivery details will appear here after approval.
                    </div>

                `;

            }


            order.innerHTML=`

                <div class="order-top">

                    <div>

                        <div class="product-name">
                            ${data.productName||"Product"}
                        </div>

                        <div class="order-id">
                            Order ID: ${item.id}
                        </div>

                        <div class="price">
                            ${money(data.price)}
                        </div>

                    </div>

                    <div class="status ${statusClass(status)}">
                        ${statusLabel(status)}
                    </div>

                </div>


                <div class="date">
                    ${dateText(data.createdAt)}
                </div>


                ${deliveryHTML}

            `;


            list.appendChild(order);

        });


    },error=>{

        console.error(error);

        list.innerHTML=`

            <div class="empty">
                Unable to load your order history.
            </div>

        `;

    });

});

</script></body>
</html>
