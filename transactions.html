<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zavixbulk | Payment History</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#050817;
    color:#fff;
    min-height:100vh;
}

.header{
    height:70px;
    background:#0a1024;
    border-bottom:1px solid #1b2542;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:100;
}

.logo{
    font-size:22px;
    font-weight:900;
}

.logo span{
    color:#4f8cff;
}

.header-right{
    color:#9cacc9;
    font-size:13px;
}

.main{
    max-width:950px;
    margin:auto;
    padding:105px 20px 50px;
}

.back{
    color:#7393d7;
    text-decoration:none;
    font-size:13px;
    display:inline-block;
    margin-bottom:20px;
}

.title{
    font-size:25px;
    font-weight:850;
    margin-bottom:20px;
}

.table-box{
    background:#0a1024;
    border:1px solid #1b2542;
    border-radius:16px;
    overflow:hidden;
}

.row{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 1fr;
    gap:15px;
    padding:16px 18px;
    border-bottom:1px solid #18223b;
    align-items:center;
}

.row:last-child{
    border-bottom:0;
}

.head{
    background:#080e20;
    color:#667b9e;
    font-size:10px;
    font-weight:800;
}

.cell{
    font-size:12px;
    color:#a7b6cd;
}

.amount{
    color:#fff;
    font-weight:800;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
    background:#102d20;
    color:#62d99a;
    text-transform:capitalize;
}

.pending{
    background:#302713;
    color:#e6c66b;
}

.failed,
.rejected{
    background:#321820;
    color:#ff7888;
}

.empty{
    text-align:center;
    padding:80px 20px;
    color:#7182a1;
    line-height:1.6;
}

.loading{
    text-align:center;
    padding:60px 20px;
    color:#7182a1;
}

@media(max-width:700px){

    .header{
        padding:0 16px;
    }

    .header-right{
        display:none;
    }

    .main{
        padding:90px 12px 35px;
    }

    .table-box{
        overflow-x:auto;
    }

    .row{
        min-width:650px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        ZAVIX<span>BULK</span>
    </div>

    <div class="header-right" id="headerName">
        Customer
    </div>

</header>


<main class="main">

    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>

    <div class="title">
        Payment History
    </div>

    <div class="table-box">

        <div class="row head">
            <div>DESCRIPTION</div>
            <div>AMOUNT</div>
            <div>STATUS</div>
            <div>DATE</div>
        </div>

        <div id="list">

            <div class="loading">
                Loading payment history...
            </div>

        </div>

    </div>

</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    where,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:"AIzaSyBybvzMgbJjxRggSV-p9cabPwhv3zvQlJs",

    authDomain:"zavixbulk.firebaseapp.com",

    projectId:"zavixbulk",

    storageBucket:"zavixbulk.firebasestorage.app",

    messagingSenderId:"819994897169",

    appId:"1:819994897169:web:4aab1bcc15fbe439f6fab0",

    measurementId:"G-GJ8RY0WYBL"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


const list =
    document.getElementById("list");

const headerName =
    document.getElementById("headerName");


function money(value){

    return "$" +
        Number(value || 0).toLocaleString(
            "en-US",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


function dateText(value){

    if(!value){
        return "Processing";
    }

    try{

        const date =
            value.toDate
                ? value.toDate()
                : new Date(value);

        return date.toLocaleString();

    }catch(error){

        return "Processing";

    }

}


function statusClass(status){

    status =
        String(status || "").toLowerCase();

    if(
        status === "pending" ||
        status === "processing"
    ){

        return "pending";

    }

    if(
        status === "failed" ||
        status === "rejected"
    ){

        return "failed";

    }

    return "";

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            location.href =
                "login.html";

            return;

        }


        try{

            /* CUSTOMER NAME */

            const userSnap =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            if(userSnap.exists()){

                const data =
                    userSnap.data();

                headerName.textContent =
                    data.fullname ||
                    data.username ||
                    "Customer";

            }


            /*
             * IMPORTANT:
             * We only use where(userId == current user).
             * We sort the records ourselves.
             *
             * This avoids the Firestore composite-index
             * problem caused by where + orderBy.
             */

            const q =
                query(
                    collection(
                        db,
                        "transactions"
                    ),
                    where(
                        "userId",
                        "==",
                        user.uid
                    )
                );


            const snapshot =
                await getDocs(q);


            if(snapshot.empty){

                list.innerHTML = `

                    <div class="empty">

                        💳<br><br>

                        No payment history yet.

                    </div>

                `;

                return;

            }


            const transactions = [];


            snapshot.forEach(item => {

                transactions.push({

                    id:item.id,

                    ...item.data()

                });

            });


            /*
             * Newest first
             */

            transactions.sort(
                (a,b) => {

                    const aTime =
                        a.createdAt?.toMillis
                            ? a.createdAt.toMillis()
                            : 0;

                    const bTime =
                        b.createdAt?.toMillis
                            ? b.createdAt.toMillis()
                            : 0;

                    return bTime - aTime;

                }
            );


            list.innerHTML = "";


            transactions.forEach(
                data => {

                    const status =
                        String(
                            data.status ||
                            "completed"
                        ).toLowerCase();


                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "row";


                    row.innerHTML = `

                        <div class="cell">

                            ${escapeHTML(
                                data.description ||
                                data.type ||
                                data.coin ||
                                "Wallet Deposit"
                            )}

                        </div>


                        <div class="cell amount">

                            ${money(data.amount)}

                        </div>


                        <div class="cell">

                            <span class="status ${statusClass(status)}">

                                ${escapeHTML(status)}

                            </span>

                        </div>


                        <div class="cell">

                            ${dateText(
                                data.createdAt
                            )}

                        </div>

                    `;


                    list.appendChild(row);

                }
            );


        }catch(error){

            console.error(
                "Payment history error:",
                error
            );


            list.innerHTML = `

                <div class="empty">

                    Unable to load payment history.<br><br>

                    Please refresh the page and try again.

                </div>

            `;

        }

    }
);

</script>

</body>
</html>
