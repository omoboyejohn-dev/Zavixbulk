<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Zavixbulk | Payment History</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#050817;
    color:#fff;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.header{
    height:70px;
    background:#0a1024;
    border-bottom:1px solid #1b2542;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:100;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:.5px;
}

.logo span{
    color:#4f8cff;
}

.header-right{
    color:#9cacc9;
    font-size:13px;
}

/* =========================
   MAIN
========================= */

.main{
    max-width:1050px;
    margin:auto;
    padding:105px 20px 50px;
}

.back{
    color:#7393d7;
    text-decoration:none;
    font-size:13px;
    display:inline-block;
    margin-bottom:20px;
}

.back:hover{
    color:#fff;
}

.title{
    font-size:25px;
    font-weight:850;
    margin-bottom:8px;
}

.subtitle{
    color:#7182a1;
    font-size:13px;
    margin-bottom:22px;
}

/* =========================
   SUMMARY
========================= */

.summary-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:20px;
}

.summary-card{
    background:#0a1024;
    border:1px solid #1b2542;
    border-radius:14px;
    padding:17px;
}

.summary-label{
    color:#6f819f;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    margin-bottom:7px;
}

.summary-value{
    font-size:20px;
    font-weight:900;
}

/* =========================
   TABLE
========================= */

.table-box{
    background:#0a1024;
    border:1px solid #1b2542;
    border-radius:16px;
    overflow:hidden;
}

.row{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 1.2fr;
    gap:15px;
    padding:16px 18px;
    border-bottom:1px solid #18223b;
    align-items:center;
}

.row:last-child{
    border-bottom:0;
}

.head{
    background:#080e20;
    color:#667b9e;
    font-size:10px;
    font-weight:800;
}

.cell{
    font-size:12px;
    color:#a7b6cd;
    min-width:0;
}

.description{
    color:#fff;
    font-weight:700;
}

.crypto{
    color:#7184a7;
    font-size:10px;
    margin-top:4px;
}

.amount{
    color:#fff;
    font-weight:800;
}

/* =========================
   STATUS
========================= */

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
    text-transform:capitalize;
}

.status.pending{
    background:#302713;
    color:#e6c66b;
}

.status.completed{
    background:#102d20;
    color:#62d99a;
}

.status.rejected{
    background:#321820;
    color:#ff7888;
}

.status.failed{
    background:#321820;
    color:#ff7888;
}

.status.processing{
    background:#17243d;
    color:#7da5ff;
}

/* =========================
   DETAILS
========================= */

.receiving{
    margin-top:5px;
    color:#617493;
    font-size:9px;
    word-break:break-all;
}

/* =========================
   EMPTY / LOADING
========================= */

.empty{
    text-align:center;
    padding:80px 20px;
    color:#7182a1;
    line-height:1.6;
}

.loading{
    text-align:center;
    padding:60px 20px;
    color:#7182a1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header{
        padding:0 16px;
    }

    .header-right{
        display:none;
    }

    .main{
        padding:90px 12px 35px;
    }

    .title{
        font-size:22px;
    }

    .summary-grid{
        grid-template-columns:1fr;
    }

    .table-box{
        overflow-x:auto;
    }

    .row{
        min-width:760px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo">
        ZAVIX<span>BULK</span>
    </div>

    <div
        class="header-right"
        id="headerName"
    >
        Customer
    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="main">


    <a
        href="dashboard.html"
        class="back"
    >
        ← Back to Dashboard
    </a>


    <div class="title">
        Payment History
    </div>


    <div class="subtitle">
        View all your cryptocurrency payment submissions and their current status.
    </div>


    <!-- =========================
         SUMMARY
    ========================== -->

    <div class="summary-grid">


        <div class="summary-card">

            <div class="summary-label">
                Total Payments
            </div>

            <div
                class="summary-value"
                id="totalCount"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Pending
            </div>

            <div
                class="summary-value"
                id="pendingCount"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Completed
            </div>

            <div
                class="summary-value"
                id="completedCount"
            >
                0
            </div>

        </div>

    </div>


    <!-- =========================
         PAYMENT TABLE
    ========================== -->

    <div class="table-box">


        <div class="row head">

            <div>
                DESCRIPTION
            </div>

            <div>
                AMOUNT
            </div>

            <div>
                STATUS
            </div>

            <div>
                DATE
            </div>

        </div>


        <div id="list">

            <div class="loading">
                Loading payment history...
            </div>

        </div>


    </div>


</main>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.2.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    query,
    where,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBybvzMgbJjxRggSV-p9cabPwhv3zvQlJs",

    authDomain:
        "zavixbulk.firebaseapp.com",

    projectId:
        "zavixbulk",

    storageBucket:
        "zavixbulk.firebasestorage.app",

    messagingSenderId:
        "819994897169",

    appId:
        "1:819994897169:web:4aab1bcc15fbe439f6fab0",

    measurementId:
        "G-GJ8RY0WYBL"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const list =
    document.getElementById("list");

const headerName =
    document.getElementById("headerName");

const totalCount =
    document.getElementById("totalCount");

const pendingCount =
    document.getElementById("pendingCount");

const completedCount =
    document.getElementById("completedCount");


/* =====================================================
   MONEY
===================================================== */

function money(value){

    const number =
        Number(value || 0);


    return "$" +
        number.toLocaleString(
            "en-US",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =====================================================
   DATE
===================================================== */

function dateText(value){

    if(!value){

        return "Processing";

    }


    try{

        const date =
            value.toDate
                ? value.toDate()
                : new Date(value);


        return date.toLocaleString(
            "en-US",
            {
                year:"numeric",
                month:"short",
                day:"numeric",
                hour:"numeric",
                minute:"2-digit"
            }
        );

    }catch(error){

        return "Processing";

    }

}


/* =====================================================
   STATUS CLASS
===================================================== */

function statusClass(status){

    const value =
        String(
            status || "pending"
        ).toLowerCase();


    if(
        value === "pending"
    ){

        return "pending";

    }


    if(
        value === "completed" ||
        value === "approved" ||
        value === "success"
    ){

        return "completed";

    }


    if(
        value === "rejected" ||
        value === "failed"
    ){

        return "rejected";

    }


    if(
        value === "processing"
    ){

        return "processing";

    }


    return "pending";

}


/* =====================================================
   DISPLAY STATUS
===================================================== */

function displayStatus(status){

    const value =
        String(
            status || "pending"
        ).toLowerCase();


    if(
        value === "approved" ||
        value === "success"
    ){

        return "completed";

    }


    if(
        value === "failed"
    ){

        return "rejected";

    }


    return value;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async user => {


        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        try{


            /* =========================================
               LOAD CUSTOMER
            ========================================= */

            const userSnap =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            if(
                userSnap.exists()
            ){

                const userData =
                    userSnap.data();


                headerName.textContent =
                    userData.fullname ||
                    userData.username ||
                    user.email ||
                    "Customer";

            }else{

                headerName.textContent =
                    user.email ||
                    "Customer";

            }


            /* =========================================
               IMPORTANT

               PAYMENT SUBMISSIONS ARE STORED IN:

               deposits

               NOT:

               transactions
            ========================================= */

            const depositsQuery =
                query(
                    collection(
                        db,
                        "deposits"
                    ),
                    where(
                        "userId",
                        "==",
                        user.uid
                    )
                );


            const snapshot =
                await getDocs(
                    depositsQuery
                );


            /* =========================================
               NO PAYMENTS
            ========================================= */

            if(
                snapshot.empty
            ){

                totalCount.textContent =
                    "0";

                pendingCount.textContent =
                    "0";

                completedCount.textContent =
                    "0";


                list.innerHTML = `

                    <div class="empty">

                        💳<br><br>

                        No payment history yet.<br>

                        Your submitted cryptocurrency payments
                        will appear here.

                    </div>

                `;

                return;

            }


            /* =========================================
               CONVERT TO ARRAY
            ========================================= */

            const payments = [];


            snapshot.forEach(
                item => {

                    payments.push({

                        id:
                            item.id,

                        ...item.data()

                    });

                }
            );


            /* =========================================
               NEWEST FIRST
            ========================================= */

            payments.sort(
                (a,b) => {


                    const aTime =
                        a.createdAt?.toMillis
                            ? a.createdAt.toMillis()
                            : (
                                a.createdAt
                                ? new Date(
                                    a.createdAt
                                ).getTime()
                                : 0
                            );


                    const bTime =
                        b.createdAt?.toMillis
                            ? b.createdAt.toMillis()
                            : (
                                b.createdAt
                                ? new Date(
                                    b.createdAt
                                ).getTime()
                                : 0
                            );


                    return bTime - aTime;

                }
            );


            /* =========================================
               COUNTERS
            ========================================= */

            let pending = 0;

            let completed = 0;


            payments.forEach(
                payment => {


                    const status =
                        String(
                            payment.status ||
                            "pending"
                        ).toLowerCase();


                    if(
                        status === "pending" ||
                        status === "processing"
                    ){

                        pending++;

                    }


                    if(
                        status === "completed" ||
                        status === "approved" ||
                        status === "success"
                    ){

                        completed++;

                    }

                }
            );


            totalCount.textContent =
                payments.length;


            pendingCount.textContent =
                pending;


            completedCount.textContent =
                completed;


            /* =========================================
               DISPLAY
            ========================================= */

            list.innerHTML = "";


            payments.forEach(
                payment => {


                    const rawStatus =
                        String(
                            payment.status ||
                            "pending"
                        ).toLowerCase();


                    const status =
                        displayStatus(
                            rawStatus
                        );


                    const cssClass =
                        statusClass(
                            rawStatus
                        );


                    /*
                       Your deposit page saves:

                       amountUSD

                       cryptocurrency

                       method

                       receivingWallet

                       senderWallet
                    */

                    const amount =
                        payment.amountUSD ??
                        payment.amount ??
                        0;


                    const cryptocurrency =
                        payment.cryptocurrency ||
                        payment.method ||
                        "Cryptocurrency";


                    const description =
                        "Crypto Deposit";


                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "row";


                    row.innerHTML = `

                        <div class="cell">

                            <div class="description">

                                ${escapeHTML(
                                    description
                                )}

                            </div>


                            <div class="crypto">

                                ${escapeHTML(
                                    cryptocurrency
                                )}

                            </div>


                            ${
                                payment.receivingWallet
                                ?
                                `
                                <div class="receiving">

                                    To:
                                    ${escapeHTML(
                                        payment.receivingWallet
                                    )}

                                </div>
                                `
                                :
                                ""
                            }

                        </div>


                        <div class="cell amount">

                            ${money(amount)}

                        </div>


                        <div class="cell">

                            <span
                                class="status ${cssClass}"
                            >

                                ${escapeHTML(
                                    status
                                )}

                            </span>

                        </div>


                        <div class="cell">

                            ${dateText(
                                payment.createdAt
                            )}

                        </div>

                    `;


                    list.appendChild(
                        row
                    );

                }
            );


        }catch(error){

            console.error(
                "Payment history error:",
                error
            );


            list.innerHTML = `

                <div class="empty">

                    Unable to load payment history.<br><br>

                    Please refresh the page and try again.

                </div>

            `;

        }

    }
);

</script>

</body>
</html>
