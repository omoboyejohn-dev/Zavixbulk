<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zavixbulk | Admin Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at top right, rgba(55,90,255,.16), transparent 35%),
        #050817;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:#0b1025;
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:35px 28px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    font-size:30px;
    font-weight:900;
    letter-spacing:1px;
    background:linear-gradient(90deg,#6c63ff,#00d4ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.logo p{
    margin-top:7px;
    color:#8e98b8;
    font-size:14px;
}

.admin-badge{
    display:inline-block;
    margin-top:12px;
    padding:7px 13px;
    border-radius:20px;
    background:rgba(108,99,255,.12);
    border:1px solid rgba(108,99,255,.25);
    color:#9d98ff;
    font-size:12px;
    font-weight:700;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#dce2f5;
    font-size:14px;
    font-weight:600;
}

input{
    width:100%;
    height:52px;
    border:none;
    outline:none;
    border-radius:12px;
    padding:0 15px;
    background:#060a19;
    border:1px solid #1c2544;
    color:#fff;
    font-size:15px;
    transition:.2s;
}

input:focus{
    border-color:#6670ff;
    box-shadow:0 0 0 3px rgba(102,112,255,.10);
}

input::placeholder{
    color:#59627f;
}

.password-wrap{
    position:relative;
}

.password-wrap input{
    padding-right:75px;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:transparent;
    color:#7e88aa;
    cursor:pointer;
    font-size:13px;
    font-weight:700;
}

.login-btn{
    width:100%;
    height:52px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#6157ff,#00bfe8);
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
    margin-top:5px;
}

.login-btn:hover{
    transform:translateY(-1px);
    opacity:.95;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;
    padding:12px 14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:13px;
    line-height:1.5;
}

.message.error{
    display:block;
    background:rgba(255,70,90,.10);
    border:1px solid rgba(255,70,90,.25);
    color:#ff9ca8;
}

.message.success{
    display:block;
    background:rgba(0,220,150,.10);
    border:1px solid rgba(0,220,150,.25);
    color:#72efc2;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#7e88aa;
    text-decoration:none;
    font-size:13px;
}

.back-link:hover{
    color:#fff;
}

.security-note{
    margin-top:25px;
    padding:13px;
    border-radius:11px;
    background:#070c1d;
    border:1px solid #151d38;
    color:#68728f;
    font-size:11px;
    line-height:1.6;
    text-align:center;
}

.loading{
    position:fixed;
    inset:0;
    background:#050817;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.loading-box{
    text-align:center;
}

.spinner{
    width:35px;
    height:35px;
    border:3px solid #202943;
    border-top-color:#6670ff;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

.loading-box p{
    color:#7e88aa;
    font-size:13px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:480px){
    .login-box{
        padding:28px 20px;
        border-radius:18px;
    }

    .logo h1{
        font-size:26px;
    }
}
</style>
</head>

<body>

<div class="loading" id="loadingScreen">
    <div class="loading-box">
        <div class="spinner"></div>
        <p>Checking admin session...</p>
    </div>
</div>

<div class="login-box">

    <div class="logo">
        <h1>ZAVIXBULK</h1>
        <p>Digital Products Marketplace</p>
        <span class="admin-badge">ADMIN PANEL</span>
    </div>

    <div id="message" class="message"></div>

    <form id="loginForm">

        <div class="form-group">
            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                autocomplete="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrap">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    id="showPassword"
                >
                    Show
                </button>
            </div>
        </div>

        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            Login to Admin
        </button>

    </form>

    <a href="../login.html" class="back-link">
        ← Back to customer login
    </a>

    <div class="security-note">
        Admin access is restricted to accounts with
        <strong>role: admin</strong> in the Zavixbulk Firestore users collection.
    </div>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.2.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyBybvzMgbJjxRggSV-p9cabPwhv3zvQlJs",
    authDomain: "zavixbulk.firebaseapp.com",
    projectId: "zavixbulk",
    storageBucket: "zavixbulk.firebasestorage.app",
    messagingSenderId: "819994897169",
    appId: "1:819994897169:web:4aab1bcc15fbe439f6fab0",
    measurementId: "G-GJ8RY0WYBL"
};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const loadingScreen =
    document.getElementById("loadingScreen");

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");

const showPassword =
    document.getElementById("showPassword");


/* =========================
   MESSAGE
========================= */

function showMessage(text, type = "error"){

    message.textContent = text;

    message.className =
        "message " + type;

}

function clearMessage(){

    message.textContent = "";

    message.className = "message";

}


/* =========================
   SHOW / HIDE PASSWORD
========================= */

showPassword.addEventListener("click", () => {

    if(passwordInput.type === "password"){

        passwordInput.type = "text";
        showPassword.textContent = "Hide";

    }else{

        passwordInput.type = "password";
        showPassword.textContent = "Show";

    }

});


/* =========================
   CHECK ADMIN ACCOUNT
========================= */

async function checkAdmin(user){

    if(!user){

        return false;

    }

    try{

        const userRef =
            doc(db, "users", user.uid);

        const userSnap =
            await getDoc(userRef);

        if(!userSnap.exists()){

            return false;

        }

        const userData =
            userSnap.data();

        return userData.role === "admin";

    }catch(error){

        console.error(
            "Admin check error:",
            error
        );

        return false;

    }

}


/* =========================
   CHECK CURRENT SESSION
========================= */

onAuthStateChanged(auth, async (user) => {

    if(user){

        const isAdmin =
            await checkAdmin(user);

        if(isAdmin){

            window.location.href = "dashboard.html";

            return;

        }

        /*
         * A normal customer must not
         * remain signed in on admin page.
         */

        try{

            await signOut(auth);

        }catch(error){

            console.error(error);

        }

    }

    loadingScreen.style.display = "none";

});


/* =========================
   LOGIN
========================= */

loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    clearMessage();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    if(!email || !password){

        showMessage(
            "Please enter your email and password."
        );

        return;

    }

    loginBtn.disabled = true;

    loginBtn.textContent =
        "Checking...";

    try{

        /*
         * Firebase Authentication login
         */

        const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        /*
         * Check Firestore role
         */

        const isAdmin =
            await checkAdmin(
                credential.user
            );

        if(!isAdmin){

            await signOut(auth);

            showMessage(
                "This account does not have admin access."
            );

            loginBtn.disabled = false;

            loginBtn.textContent =
                "Login to Admin";

            return;

        }

        showMessage(
            "Admin login successful. Opening dashboard...",
            "success"
        );

        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        }, 700);

    }catch(error){

        console.error(error);

        let errorMessage =
            "Unable to login. Please check your details.";

        if(
            error.code ===
            "auth/invalid-credential"
        ){

            errorMessage =
                "Incorrect email or password.";

        }else if(
            error.code ===
            "auth/user-not-found"
        ){

            errorMessage =
                "No account exists with this email.";

        }else if(
            error.code ===
            "auth/wrong-password"
        ){

            errorMessage =
                "Incorrect password.";

        }else if(
            error.code ===
            "auth/invalid-email"
        ){

            errorMessage =
                "Please enter a valid email address.";

        }else if(
            error.code ===
            "auth/too-many-requests"
        ){

            errorMessage =
                "Too many login attempts. Please try again later.";

        }

        showMessage(errorMessage);

        loginBtn.disabled = false;

        loginBtn.textContent =
            "Login to Admin";

    }

});

</script>

</body>
</html>
