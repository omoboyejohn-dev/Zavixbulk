<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zavixbulk Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#071423;
color:#fff;
}

.container{
width:95%;
max-width:1300px;
margin:auto;
}

/* Header */

header{
background:#0d1d35;
padding:18px 0;
border-bottom:1px solid rgba(255,255,255,.08);
position:sticky;
top:0;
z-index:999;
}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:30px;
font-weight:700;
color:#1da1ff;
}

.right{
display:flex;
align-items:center;
gap:20px;
}

.user{
font-size:16px;
font-weight:600;
}

.logout{
background:#1677ff;
padding:10px 22px;
border-radius:10px;
cursor:pointer;
font-weight:600;
transition:.3s;
}

.logout:hover{
background:#0a5ed8;
}

/* Main */

.main{
padding:30px 0;
}

/* Wallet */

.wallet{
background:linear-gradient(135deg,#1677ff,#0a4ca4);
border-radius:18px;
padding:30px;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.wallet h3{
font-size:18px;
margin-bottom:10px;
}

.wallet h1{
font-size:42px;
}

.deposit{
background:#00c853;
border:none;
padding:14px 28px;
border-radius:10px;
font-size:16px;
font-weight:600;
color:white;
cursor:pointer;
}

/* Menu */

.menu{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:30px;
}

.menu button{
background:#10284b;
color:white;
border:none;
padding:18px;
border-radius:12px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.menu button:hover{
background:#1677ff;
}

/* Search */

.search{
margin-bottom:30px;
}

.search input{
width:100%;
padding:16px;
background:#10284b;
border:none;
border-radius:12px;
color:white;
font-size:16px;
outline:none;
}

.search input::placeholder{
color:#bdd5ff;
}

.title{
font-size:28px;
margin-bottom:20px;
font-weight:700;
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

@media(max-width:800px){

.menu{
grid-template-columns:repeat(2,1fr);
}

.products{
grid-template-columns:1fr;
}

.wallet{
flex-direction:column;
gap:20px;
text-align:center;
}

.navbar{
flex-direction:column;
gap:15px;
}

}

</style>

</head>

<body>

<header>

<div class="container navbar">

<div class="logo">

ZAVIXBULK

</div>

<div class="right">

<div class="user">

Welcome,
<span id="username">Customer</span>
👋

</div>

<div class="logout" id="logoutBtn">

Logout

</div>

</div>

</div>

</header>

<div class="container main">

<div class="wallet">

<div>

<h3>Wallet Balance</h3>

<h1 id="walletBalance">$0.00</h1>

</div>

<button class="deposit">

Deposit

</button>

</div>

<div class="menu">

<button>Browse Products</button>

<button>Profile</button>

<button>My Orders</button>

<button>Transaction History</button>

<button>Contact</button>

<button>Rules</button>

</div>

<div class="search">

<input
type="text"
placeholder="Search Products..."
id="searchInput">

</div>

<h2 class="title">

Marketplace Categories

</h2>

<div class="products" id="productsContainer">

<!-- Products will be loaded here -->

</div>

<!-- PART 2 STARTS BELOW -->
<style>

/* ================= PRODUCTS ================= */

.category{
margin-bottom:50px;
}

.category h2{
font-size:28px;
margin-bottom:20px;
color:#fff;
}

.product-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.product-card{
background:#10284b;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.25);
transition:.3s;
}

.product-card:hover{
transform:translateY(-5px);
}

.product-card img{
width:100%;
height:180px;
object-fit:cover;
}

.product-info{
padding:18px;
}

.product-info h3{
font-size:18px;
margin-bottom:8px;
}

.product-price{
font-size:22px;
font-weight:bold;
color:#00d084;
margin-bottom:15px;
}

.buy-btn{
width:100%;
padding:12px;
background:#1677ff;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
transition:.3s;
}

.buy-btn:hover{
background:#005fd6;
}

</style>

<!-- GOOGLE VOICE -->

<div class="category">

<h2>Buy Google Voice Accounts</h2>

<div class="product-grid" id="googleVoiceProducts">

<!-- Firebase products -->

</div>

</div>

<!-- INSTAGRAM -->

<div class="category">

<h2>Buy Instagram Accounts</h2>

<div class="product-grid" id="instagramProducts">

<!-- Firebase products -->

</div>

</div>

<!-- FACEBOOK -->

<div class="category">

<h2>Facebook PVA Accounts</h2>

<div class="product-grid" id="facebookProducts">

<!-- Firebase products -->

</div>

</div>

<!-- YOUTUBE -->

<div class="category">

<h2>YouTube Accounts</h2>

<div class="product-grid" id="youtubeProducts">

<!-- Firebase products -->

</div>

</div>

<!-- OTHER PRODUCTS -->

<div class="category">

<h2>Other Products</h2>

<div class="product-grid" id="otherProducts">

<!-- Firebase products -->

</div>

</div>

  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
getFirestore,
collection,
query,
getDocs,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyBybvzMgbJjxRggSV-p9cabPwhv3zvQlJs",

authDomain:"zavixbulk.firebaseapp.com",

projectId:"zavixbulk",

storageBucket:"zavixbulk.firebasestorage.app",

messagingSenderId:"819994897169",

appId:"1:819994897169:web:4aab1bcc15fbe439f6fab0",

measurementId:"G-GJ8RY0WYBL"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);
    onAuthStateChanged(auth,async(user)=>{

if(!user){

window.location="login.html";

return;

}

const ref=doc(db,"users",user.uid);

const snap=await getDoc(ref);

if(snap.exists()){

document.getElementById("username").innerHTML=

snap.data().fullname;

document.getElementById("walletBalance").innerHTML=

"$"+Number(snap.data().wallet||0).toFixed(2);

}

loadProducts();

});
    async function loadProducts(){

const snap=await getDocs(collection(db,"products"));

snap.forEach((doc)=>{

const p=doc.data();

let box;

if(p.category=="Google Voice"){

box=document.getElementById("googleVoiceProducts");

}

else if(p.category=="Instagram"){

box=document.getElementById("instagramProducts");

}

else if(p.category=="Facebook"){

box=document.getElementById("facebookProducts");

}

else if(p.category=="YouTube"){

box=document.getElementById("youtubeProducts");

}

else{

box=document.getElementById("otherProducts");

}

box.innerHTML+=`

<div class="product-card">

<img src="${p.image}">

<div class="product-info">

<h3>${p.title}</h3>

<div class="product-price">

$${Number(p.price).toFixed(2)}

</div>

<button
class="buy-btn"
onclick="buyProduct('${doc.id}')">

Buy Now

</button>

</div>

</div>

`;

});

    }
    window.buyProduct=function(id){

localStorage.setItem("buyProduct",id);

window.location="product.html";

}

document.getElementById("logoutBtn").onclick=()=>{

signOut(auth).then(()=>{

window.location="login.html";

});

}

</script>

</body>

</html>
