<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Zavixbulk</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050817;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:400px;
background:#0b1230;
padding:30px;
border-radius:15px;
border:1px solid #1f3f8b;
box-shadow:0 0 25px rgba(0,119,255,.25);
}

.logo{
text-align:center;
font-size:30px;
font-weight:bold;
color:#4da3ff;
margin-bottom:10px;
}

h2{
text-align:center;
color:#fff;
margin-bottom:25px;
}

.input-box{
margin-bottom:15px;
}

.input-box label{
display:block;
margin-bottom:6px;
color:#ddd;
font-size:14px;
}

.input-box input{
width:100%;
padding:13px;
border:none;
border-radius:8px;
background:#16224d;
color:#fff;
font-size:15px;
outline:none;
}

.input-box input:focus{
border:1px solid #3399ff;
}

button{
width:100%;
padding:14px;
background:linear-gradient(90deg,#2b6cff,#00b7ff);
border:none;
border-radius:8px;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:.9;
}

button:disabled{
opacity:.7;
cursor:not-allowed;
}

#message{
margin-top:15px;
text-align:center;
font-size:14px;
color:red;
}

.bottom{
text-align:center;
margin-top:20px;
color:#ccc;
}

.bottom a{
color:#4da3ff;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">ZAVIXBULK</div>

<h2>Login</h2>

<form id="loginForm">

<div class="input-box">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required
>

</div>


<div class="input-box">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required
>

</div>


<button
type="submit"
id="loginButton"
>
Login
</button>


<div id="message"></div>

</form>


<div class="bottom">

Don't have an account?

<a href="register.html">
Register
</a>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.2.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore.js";


/* ================================
   ZAVIXBULK FIREBASE CONFIG
================================ */

const firebaseConfig = {

apiKey:
"AIzaSyBybvzMgbJjxRggSV-p9cabPwhv3zvQlJs",

authDomain:
"zavixbulk.firebaseapp.com",

projectId:
"zavixbulk",

storageBucket:
"zavixbulk.firebasestorage.app",

messagingSenderId:
"819994897169",

appId:
"1:819994897169:web:4aab1bcc15fbe439f6fab0",

measurementId:
"G-GJ8RY0WYBL"

};


/* ================================
   INITIALIZE FIREBASE
================================ */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ================================
   FORM
================================ */

const loginForm =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const message =
document.getElementById("message");


/* ================================
   LOGIN
================================ */

loginForm.addEventListener(
"submit",
async (e)=>{

e.preventDefault();


const email =
emailInput.value.trim();

const password =
passwordInput.value;


message.textContent="";

loginButton.disabled=true;

loginButton.textContent="Logging in...";


try{


/* ================================
   FIREBASE AUTH LOGIN
================================ */

const userCredential =
await signInWithEmailAndPassword(
auth,
email,
password
);


const user =
userCredential.user;


/* ================================
   GET USER DATA
================================ */

const userRef =
doc(
db,
"users",
user.uid
);

const userSnap =
await getDoc(userRef);


/* ================================
   CHECK USER ROLE
================================ */

if(userSnap.exists()){

const userData =
userSnap.data();


/* ADMIN */

if(userData.role === "admin"){

window.location.href =
"admin/index.html";

return;

}

}


/* ================================
   CUSTOMER
================================ */

window.location.href =
"dashboard.html";


}catch(error){

console.error(
"Login Error:",
error
);


if(
error.code ===
"auth/invalid-credential"
){

message.textContent =
"Invalid email or password.";

}

else if(
error.code ===
"auth/invalid-email"
){

message.textContent =
"Please enter a valid email address.";

}

else if(
error.code ===
"auth/user-not-found"
){

message.textContent =
"Invalid email or password.";

}

else if(
error.code ===
"auth/wrong-password"
){

message.textContent =
"Invalid email or password.";

}

else if(
error.code ===
"auth/user-disabled"
){

message.textContent =
"This account has been disabled.";

}

else if(
error.code ===
"auth/too-many-requests"
){

message.textContent =
"Too many login attempts. Please try again later.";

}

else if(
error.code ===
"auth/network-request-failed"
){

message.textContent =
"Network error. Check your internet connection.";

}

else{

message.textContent =
error.message;

}


loginButton.disabled=false;

loginButton.textContent="Login";

}

});

</script>

</body>
</html>
