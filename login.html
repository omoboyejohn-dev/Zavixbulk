<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Zavixbulk</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050817;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:400px;
background:#0b1230;
padding:30px;
border-radius:15px;
border:1px solid #1f3f8b;
box-shadow:0 0 25px rgba(0,119,255,.25);
}

.logo{
text-align:center;
font-size:30px;
font-weight:bold;
color:#4da3ff;
margin-bottom:10px;
}

h2{
text-align:center;
color:#fff;
margin-bottom:25px;
}

.input-box{
margin-bottom:15px;
}

.input-box label{
display:block;
margin-bottom:6px;
color:#ddd;
}

.input-box input{
width:100%;
padding:13px;
border:none;
border-radius:8px;
background:#16224d;
color:#fff;
outline:none;
}

button{
width:100%;
padding:14px;
background:linear-gradient(90deg,#2b6cff,#00b7ff);
border:none;
border-radius:8px;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

#message{
margin-top:15px;
text-align:center;
color:red;
}

.bottom{
text-align:center;
margin-top:20px;
color:#ccc;
}

.bottom a{
color:#4da3ff;
text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">ZAVIXBULK</div>

<h2>Login</h2>

<form id="loginForm">

<div class="input-box">
<label>Email Address</label>
<input type="email" id="email" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" id="password" required>
</div>

<button type="submit">Login</button>

<div id="message"></div>

</form>

<div class="bottom">
Don't have an account?
<a href="register.html">Register</a>
</div>

</div>

<!-- Firebase Login Script goes here -->

</body>
</html>
