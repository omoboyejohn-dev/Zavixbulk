<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zavixbulk | Products</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#050817;
    color:#fff;
    min-height:100vh;
}

.header{
    height:70px;
    background:#0a1024;
    border-bottom:1px solid #1b2542;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;
}

.logo{
    color:#fff;
    font-size:22px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:#4f8cff;
}

.header-right{
    display:flex;
    align-items:center;
    gap:18px;
}

.user-name{
    color:#a9b8d5;
    font-size:13px;
}

.menu-btn{
    display:none;
    background:none;
    border:0;
    color:#fff;
    font-size:25px;
}

.sidebar{
    position:fixed;
    top:70px;
    left:0;
    bottom:0;
    width:245px;
    background:#080d20;
    border-right:1px solid #1b2542;
    padding:22px 14px;
    z-index:900;
}

.sidebar-title{
    color:#65769a;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin:0 12px 12px;
}

.nav-link{
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px 14px;
    margin-bottom:5px;
    border-radius:10px;
    color:#91a0bd;
    text-decoration:none;
    font-size:14px;
}

.nav-link:hover{
    background:#111a35;
    color:#fff;
}

.nav-link.active{
    background:linear-gradient(135deg,#1c4ed8,#2868ff);
    color:#fff;
}

.nav-icon{
    width:22px;
    text-align:center;
}

.logout{
    margin-top:20px;
    color:#ff7180;
    cursor:pointer;
}

.main{
    margin-left:245px;
    padding:95px 28px 40px;
}

.page-title{
    font-size:27px;
    font-weight:800;
    margin-bottom:7px;
}

.page-subtitle{
    color:#7586a8;
    font-size:14px;
    margin-bottom:24px;
}

.toolbar{
    display:flex;
    gap:12px;
    margin-bottom:24px;
}

.search{
    flex:1;
    max-width:500px;
    background:#0a1024;
    border:1px solid #1b2542;
    color:#fff;
    border-radius:10px;
    padding:13px 15px;
    outline:none;
}

.search:focus{
    border-color:#4d82ff;
}

.category-bar{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding-bottom:5px;
    margin-bottom:25px;
}

.category-btn{
    flex-shrink:0;
    border:1px solid #263454;
    background:#0a1024;
    color:#93a3c2;
    padding:9px 14px;
    border-radius:20px;
    cursor:pointer;
    font-size:12px;
}

.category-btn:hover,
.category-btn.active{
    background:#1b4ed8;
    border-color:#1b4ed8;
    color:#fff;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:17px;
}

.product-card{
    background:#0a1024;
    border:1px solid #1b2542;
    border-radius:14px;
    overflow:hidden;
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-3px);
    border-color:#315fc4;
}

.product-image{
    width:100%;
    height:175px;
    background:#11182d;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-image{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    color:#526381;
}

.product-content{
    padding:15px;
}

.category-name{
    color:#5e8dff;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    margin-bottom:7px;
}

.product-name{
    font-size:15px;
    font-weight:750;
    line-height:1.35;
    margin-bottom:8px;
}

.product-description{
    color:#7182a2;
    font-size:11px;
    line-height:1.45;
    height:32px;
    overflow:hidden;
}

.product-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:15px;
}

.price{
    font-size:16px;
    font-weight:800;
}

.buy-btn{
    border:0;
    background:linear-gradient(135deg,#1c4ed8,#2868ff);
    color:#fff;
    padding:9px 14px;
    border-radius:8px;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:#687a99;
    border:1px dashed #1b2947;
    border-radius:13px;
}

.loading{
    text-align:center;
    padding:60px;
    color:#7485a5;
}

.spinner{
    width:35px;
    height:35px;
    border:3px solid #1a2948;
    border-top-color:#4d83ff;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 15px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.overlay{
    display:none;
    position:fixed;
    inset:70px 0 0;
    background:rgba(0,0,0,.6);
    z-index:850;
}

@media(max-width:1150px){

    .product-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:900px){

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:700px){

    .header{
        padding:0 16px;
    }

    .user-name{
        display:none;
    }

    .menu-btn{
        display:block;
    }

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .overlay.show{
        display:block;
    }

    .main{
        margin-left:0;
        padding:92px 15px 30px;
    }

    .page-title{
        font-size:23px;
    }

    .product-grid{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .product-image{
        height:145px;
    }

    .product-content{
        padding:12px;
    }

    .product-name{
        font-size:13px;
    }

    .price{
        font-size:14px;
    }

    .buy-btn{
        padding:8px 10px;
        font-size:11px;
    }

}

@media(max-width:430px){

    .product-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<header class="header">

    <div class="logo">
        ZAVIX<span>BULK</span>
    </div>

    <div class="header-right">

        <div class="user-name" id="userName">
            Customer
        </div>

        <button class="menu-btn" id="menuBtn">
            ☰
        </button>

    </div>

</header>


<div class="overlay" id="overlay"></div>


<aside class="sidebar" id="sidebar">

    <div class="sidebar-title">
        Marketplace
    </div>

    <a href="dashboard.html" class="nav-link">
        <span class="nav-icon">📊</span>
        Dashboard
    </a>

    <a href="products.html" class="nav-link active">
        <span class="nav-icon">💎</span>
        Browse Products
    </a>

    <a href="wallet.html" class="nav-link">
        <span class="nav-icon">💰</span>
        Deposit
    </a>

    <a href="orders.html" class="nav-link">
        <span class="nav-icon">📦</span>
        My Orders
    </a>

    <a href="transactions.html" class="nav-link">
        <span class="nav-icon">💳</span>
        Payment History
    </a>

    <a href="profile.html" class="nav-link">
        <span class="nav-icon">👤</span>
        Profile
    </a>

    <a href="settings.html" class="nav-link">
        <span class="nav-icon">⚙️</span>
        Settings
    </a>

    <a href="notifications.html" class="nav-link">
        <span class="nav-icon">🔔</span>
        Notifications
    </a>

    <a href="support.html" class="nav-link">
        <span class="nav-icon">💬</span>
        Support
    </a>

    <div class="nav-link logout" id="logoutBtn">
        <span class="nav-icon">🚪</span>
        Logout
    </div>

</aside>


<main class="main">

    <h1 class="page-title">
        Browse Products
    </h1>

    <p class="page-subtitle">
        Choose a product from the marketplace.
    </p>


    <div class="toolbar">

        <input
            type="search"
            id="searchInput"
            class="search"
            placeholder="Search products..."
        >

    </div>


    <div
        class="category-bar"
        id="categoryBar"
    >

        <button
            class="category-btn active"
            data-category="all"
        >
            All
        </button>

    </div>


    <div
        class="product-grid"
        id="productGrid"
    >

        <div class="loading">
            <div class="spinner"></div>
            Loading products...
        </div>

    </div>

</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.2.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey:"AIzaSyBybvzMgbJjxRggSV-p9cabPwhv3zvQlJs",
    authDomain:"zavixbulk.firebaseapp.com",
    projectId:"zavixbulk",
    storageBucket:"zavixbulk.firebasestorage.app",
    messagingSenderId:"819994897169",
    appId:"1:819994897169:web:4aab1bcc15fbe439f6fab0",
    measurementId:"G-GJ8RY0WYBL"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const productGrid =
    document.getElementById("productGrid");

const categoryBar =
    document.getElementById("categoryBar");

const searchInput =
    document.getElementById("searchInput");

const userName =
    document.getElementById("userName");

let products = [];

let selectedCategory = "all";


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* USD MONEY FORMAT */

function formatMoney(value){

    const amount = Number(value);

    if(!Number.isFinite(amount)){
        return "$0.00";
    }

    return "$" + amount.toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


async function loadCategories(){

    try{

        const snapshot =
            await getDocs(
                collection(db,"categories")
            );

        snapshot.forEach(categoryDoc => {

            const data =
                categoryDoc.data();

            if(data.active === false){
                return;
            }

            const button =
                document.createElement("button");

            button.className =
                "category-btn";

            button.dataset.category =
                categoryDoc.id;

            button.textContent =
                data.name || "Category";

            categoryBar.appendChild(button);

        });


        document
            .querySelectorAll(".category-btn")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(".category-btn")
                            .forEach(btn =>
                                btn.classList.remove("active")
                            );

                        button.classList.add("active");

                        selectedCategory =
                            button.dataset.category;

                        renderProducts();

                    }
                );

            });

    }catch(error){

        console.error(
            "Category loading error:",
            error
        );

    }

}


async function loadProducts(){

    try{

        const productsQuery =
            query(
                collection(db,"products"),
                orderBy("createdAt","desc")
            );

        const snapshot =
            await getDocs(productsQuery);

        products = [];

        snapshot.forEach(productDoc => {

            const data =
                productDoc.data();

            if(data.active === false){
                return;
            }

            products.push({
                id:productDoc.id,
                ...data
            });

        });

        renderProducts();

    }catch(error){

        console.error(
            "Product loading error:",
            error
        );

        productGrid.innerHTML = `
            <div class="empty">
                Unable to load products.
                <br><br>
                Please refresh the page.
            </div>
        `;

    }

}


function renderProducts(){

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        products.filter(product => {

            const matchesCategory =
                selectedCategory === "all" ||
                product.categoryId === selectedCategory;


            const text =
                (
                    (product.name || "") +
                    " " +
                    (product.categoryName || "") +
                    " " +
                    (product.description || "")
                ).toLowerCase();


            const matchesSearch =
                !search ||
                text.includes(search);


            return matchesCategory &&
                   matchesSearch;

        });


    if(filtered.length === 0){

        productGrid.innerHTML = `
            <div class="empty">
                No products available.
            </div>
        `;

        return;

    }


    let html = "";


    filtered.forEach(product => {

        const image =
            product.imageUrl ||
            product.image ||
            "";


        html += `

            <div class="product-card">

                <div class="product-image">

                    ${
                        image

                        ?

                        `<img
                            src="${escapeHTML(image)}"
                            alt="${escapeHTML(product.name)}"
                            onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
                        >

                        <div
                            class="no-image"
                            style="display:none;"
                        >
                            📦
                        </div>`

                        :

                        `<div class="no-image">
                            📦
                        </div>`
                    }

                </div>


                <div class="product-content">

                    <div class="category-name">
                        ${escapeHTML(
                            product.categoryName ||
                            "Product"
                        )}
                    </div>


                    <div class="product-name">
                        ${escapeHTML(
                            product.name ||
                            "Product"
                        )}
                    </div>


                    <div class="product-description">
                        ${escapeHTML(
                            product.description ||
                            "View product details."
                        )}
                    </div>


                    <div class="product-bottom">

                        <div class="price">
                            ${formatMoney(product.price)}
                        </div>


                        <a
                            class="buy-btn"
                            href="product.html?id=${encodeURIComponent(product.id)}"
                        >
                            Buy
                        </a>

                    </div>

                </div>

            </div>

        `;

    });


    productGrid.innerHTML =
        html;

}


searchInput.addEventListener(
    "input",
    renderProducts
);


/* MOBILE MENU */

const menuBtn =
    document.getElementById("menuBtn");

const sidebar =
    document.getElementById("sidebar");

const overlay =
    document.getElementById("overlay");


menuBtn.addEventListener(
    "click",
    () => {

        sidebar.classList.toggle("open");

        overlay.classList.toggle("show");

    }
);


overlay.addEventListener(
    "click",
    () => {

        sidebar.classList.remove("open");

        overlay.classList.remove("show");

    }
);


/* AUTH */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        try{

            const userSnapshot =
                await getDoc(
                    doc(db,"users",user.uid)
                );


            if(userSnapshot.exists()){

                const data =
                    userSnapshot.data();

                userName.textContent =
                    data.fullname ||
                    data.username ||
                    "Customer";

            }


            await loadCategories();

            await loadProducts();

        }catch(error){

            console.error(
                "Authentication/page loading error:",
                error
            );

        }

    }
);


/* LOGOUT */

document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        async () => {

            try{

                await signOut(auth);

                window.location.href =
                    "login.html";

            }catch(error){

                console.error(error);

            }

        }
    );

</script>

</body>
</html>
